# Ghostline: one app target for iPhone and Mac (iOS 26 / macOS 26), one bundle id, one shared package.
# Regenerate before every build: xcodegen generate --spec project.yml
# NEVER put signing here: simulator builds pass CODE_SIGNING_ALLOWED=NO, archives pass the team and automatic style
# (skills/skill-ios-release.md §1).
name: Ghostline
options:
  bundleIdPrefix: com.wavetech
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Staging.xcconfig
  Release: Config/Production.xcconfig
packages:
  GhostlineKit:
    path: GhostlineKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ghostline:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Ghostline/Sources
      - path: Ghostline/Resources/Assets.xcassets
    dependencies:
      - package: GhostlineKit
    entitlements:
      path: Ghostline/Resources/Ghostline.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: production
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Ghostline/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ghostline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Ghostline is a research tool for its owner, not investment advice."
        GHOSTLINE_API_BASE_URL: $(GHOSTLINE_API_BASE_URL)
        GHOSTLINE_ENVIRONMENT: $(GHOSTLINE_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wavetech.ghostline
        PRODUCT_NAME: Ghostline
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
  GhostlineTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GhostlineTests
    dependencies:
      - target: Ghostline
      - package: GhostlineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wavetech.ghostline.tests
        # XcodeGen writes the iOS test-host path for both destinations; the Mac bundle keeps its binary in Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Ghostline.app/Contents/MacOS/Ghostline
        "BUNDLE_LOADER[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Ghostline.app/Contents/MacOS/Ghostline
schemes:
  Ghostline:
    build:
      targets:
        Ghostline: all
        GhostlineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GhostlineTests
    archive:
      config: Release
