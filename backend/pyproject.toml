[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostline"
version = "0.0.0"
description = "Ghostline backend: the API and the worker of a personal stock research app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyJWT[crypto]>=2.9,<3",
    "httpx[http2]>=0.27,<1",
    "APScheduler>=3.10,<4",
    "python-multipart>=0.0.9,<1",
    "minio>=7.2,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["ghostline*"]

# Files the code reads at run time. The image builds without .git, so nothing but this list puts them in the package.
[tool.setuptools.package-data]
"ghostline.claude.prompts" = ["*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
